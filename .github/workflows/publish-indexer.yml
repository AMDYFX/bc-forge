name: Publish indexer image

# Builds indexer/Dockerfile and publishes the image to the GitHub Container
# Registry as soon as an indexer release tag lands. Component tags for the sdk,
# cli, and react packages (sdk-v*, cli-v*, react-v*) do not match this filter,
# so they never push an image.
#
# Tag convention: indexer-v<semver>, e.g. indexer-v1.2.3 or indexer-v1.2.3-rc.1
on:
  push:
    tags:
      - 'indexer-v*'

# Only `packages: write` is needed to push to GHCR. `contents: read` is the
# minimum required to check out the repository. No other scopes are granted and
# no repository secrets are referenced: authentication uses the automatic
# GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bcpathway/bc-forge-indexer
  TAG_PREFIX: indexer-v

jobs:
  publish:
    name: Build and push indexer image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail

          git_tag="${GITHUB_REF_NAME}"
          if [[ "$git_tag" != "${TAG_PREFIX}"* ]]; then
            echo "::error::Unexpected tag ${git_tag}; expected ${TAG_PREFIX}<semver>."
            exit 1
          fi

          # e.g. 1.2.3, 1.2.3-rc.1
          version="${git_tag#${TAG_PREFIX}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${git_tag} does not carry a semantic version."
            exit 1
          fi

          # A semver prerelease carries a hyphen in its core-to-pre tag segment.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          tags="${REGISTRY}/${IMAGE_NAME}:${version}"
          tags="${tags},${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"

          # `latest` tracks stable releases only; a prerelease must never take
          # over the channel default.
          if [[ "$is_prerelease" == "false" ]]; then
            tags="${tags},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          {
            echo "version=${version}"
            echo "is_prerelease=${is_prerelease}"
            echo "tags=${tags}"
            # Tag pushes carry no head_commit, so stamp the build here.
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${REGISTRY}/${IMAGE_NAME} for ${git_tag} (prerelease=${is_prerelease})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./indexer
          file: ./indexer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            BUILD_NAME=bc-forge-indexer
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published tags
        run: |
          {
            echo "### Indexer image published"
            echo ""
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Prerelease: \`${{ steps.meta.outputs.is_prerelease }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
