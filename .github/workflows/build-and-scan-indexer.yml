name: Build and Scan Indexer Image

on:
  push:
    branches: [main]
    paths:
      - 'indexer/**'
  pull_request:
    branches: [main]
    paths:
      - 'indexer/**'
  workflow_dispatch:

env:
  IMAGE_NAME: bc-forge-indexer
  REGISTRY: ghcr.io

jobs:
  build-and-scan:
    name: Build and Scan Indexer Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq for YAML parsing
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Docker image
        run: docker load < /tmp/image.tar

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          vuln-type: 'os,library'
          scan-ref: '.'
          skip-dirs: '/tmp'

      - name: Parse Trivy results for fixable critical vulnerabilities
        id: check-vulns
        run: |
          # Check for fixable critical vulnerabilities
          FIXABLE_CRITICAL=$(jq -r '
            .runs[].results[] |
            select(.level == "ERROR") |
            select(.fixes != null and (.fixes | length > 0)) |
            .ruleId
          ' trivy-results.sarif | wc -l)

          echo "fixable_critical_count=$FIXABLE_CRITICAL" >> $GITHUB_OUTPUT
          
          if [ "$FIXABLE_CRITICAL" -gt 0 ]; then
            echo "::warning::Found $FIXABLE_CRITICAL fixable critical vulnerabilities. Checking for exceptions..."
            
            # Extract CVE IDs from findings
            jq -r '
              .runs[].results[] |
              select(.level == "ERROR") |
              select(.fixes != null and (.fixes | length > 0)) |
              .ruleId
            ' trivy-results.sarif > /tmp/cves.txt
            
            # Check against exceptions file
            BLOCKED_COUNT=0
            while IFS= read -r cve; do
              if [ -n "$cve" ]; then
                EXCEPTION=$(yq eval ".exceptions[] | select(.cve == \"$cve\")" .github/vulnerability-exceptions.yml 2>/dev/null || echo "")
                if [ -z "$EXCEPTION" ]; then
                  echo "::error::No exception found for $cve. Release blocked."
                  BLOCKED_COUNT=$((BLOCKED_COUNT + 1))
                else
                  EXPIRY=$(yq eval ".exceptions[] | select(.cve == \"$cve\") | .expires" .github/vulnerability-exceptions.yml)
                  ADVISORY=$(yq eval ".exceptions[] | select(.cve == \"$cve\") | .advisory" .github/vulnerability-exceptions.yml)
                  echo "::notice::Exception found for $cve (Advisory: $ADVISORY, Expires: $EXPIRY)"
                  
                  # Check if exception has expired
                  TODAY=$(date +%Y-%m-%d)
                  if [[ "$TODAY" > "$EXPIRY" ]]; then
                    echo "::error::Exception for $cve expired on $EXPIRY. Release blocked."
                    BLOCKED_COUNT=$((BLOCKED_COUNT + 1))
                  fi
                fi
              fi
            done < /tmp/cves.txt
            
            echo "blocked_count=$BLOCKED_COUNT" >> $GITHUB_OUTPUT
            
            if [ "$BLOCKED_COUNT" -gt 0 ]; then
              echo "::error::$BLOCKED_COUNT fixable critical vulnerabilities without valid exceptions. Release blocked."
              jq -r '
                .runs[].results[] |
                select(.level == "ERROR") |
                select(.fixes != null and (.fixes | length > 0)) |
                "\(.ruleId): \(.message.text)"
              ' trivy-results.sarif | head -20
              exit 1
            else
              echo "All fixable critical vulnerabilities have valid exceptions."
            fi
          else
            echo "No fixable critical vulnerabilities found."
          fi

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-indexer'

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 90

      - name: Generate human-readable report
        if: always()
        run: |
          trivy image ${{ steps.meta.outputs.tags }} \
            --format table \
            --severity CRITICAL,HIGH \
            --output trivy-report.txt || true

      - name: Upload human-readable report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 90

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
