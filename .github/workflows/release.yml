name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate packages before publish
        run: npm run release:validate

      - name: Version and publish with Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: release packages'
          title: 'chore: release packages'
          publish: |
            npm run build --workspace @bc-forge/sdk
            npm run build --workspace @bc-forge/cli
            npm run build --workspace @bc-forge/react
            npm run build --workspace @bc-forge/indexer
            npm config set provenance true
            npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate component release notes
        id: release-notes
        shell: bash
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          published='${{ steps.changesets.outputs.publishedPackages }}'
          if [[ -z "$published" || "$published" == "[]" || "$published" == "null" ]]; then
            echo "component=none" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "No package release notes were generated for this run." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          component="$(node - <<'NODE'
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
          const names = Array.isArray(published) ? published.map((pkg) => pkg.name).filter(Boolean) : [];
          const preferred = ['@bc-forge/react', '@bc-forge/indexer', '@bc-forge/sdk', '@bc-forge/cli'];
          const match = preferred.find((name) => names.includes(name));
          process.stdout.write(match || names[0] || 'none');
          NODE
          )"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          case "$component" in
            '@bc-forge/react')
              body="$(npm run --silent release:notes:react)"
              ;;
            '@bc-forge/indexer')
              body="$(npm run --silent release:notes:indexer)"
              ;;
            *)
              body="No component release notes were generated for this run."
              ;;
          esac

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Attach release notes to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
