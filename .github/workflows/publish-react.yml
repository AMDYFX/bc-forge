name: Publish React

# Publishes @bc-forge/react only when a React release tag is pushed.
# sdk-v*, cli-v*, indexer-v*, and bare v* tags do not trigger this workflow.
#
# Every npm command runs from the repository root. Do not set
# defaults.run.working-directory to react/: `npm run build --workspace`
# resolves workspaces from the root package.json.

on:
  push:
    tags:
      - "react-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @bc-forge/react
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace @bc-forge/react

      - name: Test
        run: npm test --workspace @bc-forge/react -- --runInBand

      - name: Build SDK dependency
        run: npm run build --workspace @bc-forge/sdk

      - name: Build React package
        run: npm run build --workspace @bc-forge/react

      - name: Validate the packed tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/react-pack"
          npm pack --workspace @bc-forge/react --pack-destination "$RUNNER_TEMP/react-pack"
          tarball="$(find "$RUNNER_TEMP/react-pack" -name 'bc-forge-react-*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tzf "$tarball" > "$RUNNER_TEMP/react-pack-list.txt"
          for entry in package/dist/index.js package/dist/index.mjs package/dist/index.d.ts; do
            grep -qx "$entry" "$RUNNER_TEMP/react-pack-list.txt" || { echo "missing $entry"; exit 1; }
          done
          if grep -E '^package/src/.*\.(ts|tsx)$' "$RUNNER_TEMP/react-pack-list.txt"; then
            echo "tarball contains unbuilt sources"
            exit 1
          fi

      - name: Guard the release tag against the package version
        run: node scripts/check-version-tag.mjs "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set provenance true
          npm publish --workspace @bc-forge/react --access public
