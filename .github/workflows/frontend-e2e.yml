name: Frontend E2E

on:
  pull_request:
    paths:
      - 'react/**'
      - 'sdk/**'
      - '.github/workflows/frontend-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'react/**'
      - 'sdk/**'
      - '.github/workflows/frontend-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Frontend E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK workspace
        run: npm run build --workspace @bc-forge/sdk

      - name: Build React workspace
        run: npm run build --workspace @bc-forge/react

      - name: Lint React workspace
        run: npm run lint --workspace @bc-forge/react

      - name: Run React unit tests
        run: npm test --workspace @bc-forge/react

      - name: Install React demo dependencies
        working-directory: react/demo
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: react
        env:
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: react/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
# Automated CI trigger
